name: test-snyk-sca-workflow
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  build:
    steps:
      - name: checkout-source-code
        uses: cloudbees-io/checkout@v1
      - name: Run Snyk SCA
        uses: cloudbees-io/snyk-sca-plugin@v1
        with:
          org-id: ${{ vars.SNYK_ORG_ID }}
          snyk-token: ${{ secrets.SNYK_TOKEN}}